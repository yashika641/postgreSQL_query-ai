global:
  scrape_interval: 5s

scrape_configs:
  - job_name: query_ai_backend
    static_configs:
      # backend is now a Compose service in the same network as
      # Prometheus (Dockerfile.backend, see docker-compose.yml) --
      # reachable directly by service name via Compose's internal DNS,
      # no host.docker.internal needed for this link. (host.docker.internal
      # is still used by the backend service itself, to reach the native
      # Postgres install running on the host, outside this compose stack.)
      - targets: ["backend:8000"]
